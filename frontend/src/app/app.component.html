<div class="app-container">
        <header class="header">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1>Nexus AI <span>Knowledge Base</span></h1>
            </div>
            <div class="header-actions">
                <p class="subtitle">Ask questions about your uploaded documents</p>
                <div class="upload-container">
                    <button class="upload-btn" (click)="fileInput.click()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Upload PDF
                    </button>
                    <input #fileInput type="file" (change)="onFileSelected($event)" accept="application/pdf" style="display: none">
                </div>
            </div>
        </header>

  <main class="chat-container">
      <div class="chat-box" #chatBox>
          <div *ngFor="let msg of messages" class="message" [ngClass]="msg.isUser ? 'user-message' : 'system-message'">
              <div class="avatar" [ngClass]="msg.isUser ? 'user-avatar' : 'system-avatar'">
                  {{ msg.isUser ? 'You' : 'AI' }}
              </div>
              <div class="message-content" [innerHTML]="msg.content"></div>
          </div>

          <div *ngIf="isLoading" class="message system-message">
              <div class="avatar system-avatar">AI</div>
              <div class="message-content">
                  <div class="loading-dots">
                      <div class="dot"></div>
                      <div class="dot"></div>
                      <div class="dot"></div>
                  </div>
              </div>
          </div>
      </div>

      <div class="input-container">
          <form (ngSubmit)="sendMessage()">
              <input type="text" [(ngModel)]="currentQuestion" name="question" placeholder="Type your question here..." autocomplete="off" required>
              <button type="submit" [disabled]="isLoading || !currentQuestion.trim()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
              </button>
          </form>
      </div>
  </main>
</div>
